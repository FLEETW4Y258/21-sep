<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For you someday</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- ==========================================
         ESCENARIO 1: LA PANTALLA NEGRA INICIAL
         ========================================== -->
    <div id="pantalla-intro" class="pantalla-intro">
        
        <img src="saludo.gif" alt="GIF de inicio" class="gif-intro" style="display: none;">

        <div class="cuadro-texto">
            <p id="texto-animado"></p>
            <img src="boton.png" id="boton-flores" alt="Continuar" style="display: none;">
        </div>

    </div> 

    <!-- ==========================================
         ESCENARIO 2: EL VIDEO Y LAS CARTAS NUEVAS
         ========================================== -->
    <div class="pantalla-video" style="display: none;">
        
        <video autoplay muted loop id="video-fondo">
            <source src="Gardenia Free Flowers Background Videos, Motion Graphics, No Copyright  _ All Background Videos.mp4" type="video/mp4">
        </video>

        <div class="contenedor-cartas">
            <button id="btn-anterior-carta" class="boton-navegacion izquierda" style="display: none;">❮</button>

            <!-- CAJA DE LA CARTA INFALIBLE -->
            <div id="carta-actual" style="opacity: 0;">
                <img id="img-fondo-carta" src="" alt="Fondo Carta" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; z-index: -1;">
               <img id="gif-decor-1" class="gif-carta gif-pos-1" src="" alt="decor 1">
                <img id="gif-decor-2" class="gif-carta gif-pos-2" src="" alt="decor 2">
                <img id="gif-decor-3" class="gif-carta gif-pos-3" src="" alt="decor 3">
                <p id="texto-carta"></p>
            </div>

            <button id="btn-siguiente-carta" class="boton-navegacion derecha">❯</button>
        </div>

    </div>

    <!-- ==========================================
         AUDIOS DEL PROYECTO
         ========================================== -->
    <audio id="sonido-tecleo" src="Asriel Dialogue Sound Effect (Undertale Character Voice Beeps).mp3" loop></audio>
    <audio id="musica-fondo" src="012. Home (UNDERTALE Soundtrack) - Toby Fox.mp3" loop></audio>
    <audio id="musica-cartas" src="Floricienta — Flores Amarillas [Letra].mp3" loop></audio>

    <!-- AQUÍ ESTÁ LA CONEXIÓN VITAL CON TU CÓDIGO -->
    <script src="script.js"></script>
</body>
</html>
